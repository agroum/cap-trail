    if (persistAsked || !navigator.storage || !navigator.storage.persist) return;
    persistAsked = true;
    navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }).catch(() => {});
  }
  /* Applique un changement et l'enregistre ; annule tout si l'enregistrement échoue. */
  function commit(mutate) {
    const before = { entries: S.entries, settings: S.settings };
    mutate();
    if (!persist()) { S.entries = before.entries; S.settings = before.settings; return false; }
    askPersist();
    return true;
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  S.entries = loadEntries();
  S.settings = loadSettings();
  try { const t = localStorage.getItem('ct-tab'); if (['today', 'journal', 'progress', 'plan'].includes(t)) S.tab = t; } catch (e) { /* stockage indisponible */ }

  const byDateDesc = (a, b) => b.date.localeCompare(a.date) || ((b.createdAt || 0) - (a.createdAt || 0));
  const byDateAsc = (a, b) => a.date.localeCompare(b.date) || ((a.createdAt || 0) - (b.createdAt || 0));
  const ofKind = k => S.entries.filter(e => e.kind === k);
  const runs = () => ofKind('run');
  const sessionsOn = d => S.entries.filter(e => e.date === d && e.kind !== 'checkin');
  const planFor = d => dayPlan(d, S.entries, S.settings, todayIso());
  const rstate = () => runState(S.entries, S.settings.runStart, todayIso());
  /* Niveau en vigueur à une date (pour une course notée après coup). */
  const levelAt = d => runState(S.entries.filter(e => e.kind !== 'run' || e.date < d), S.settings.runStart, d).level;
  const renfoDef = id => RENFO.find(x => x.id === id) || null;
  const renfoLevel = id => {
    const r = renfoDef(id);
    if (!r) return 1;
    return Math.min(Math.max(1, (S.settings.renfoLevels || {})[id] || RENFO_START[id] || 1), r.levels.length);
  };

  function planName(p) {
    if (p.type === 'run') return p.adapted === 'stop' ? 'Pas de course' : `Course · ${p.minutes} min`;
    if (p.type === 'cardio') return 'Cardio sans choc';
    if (p.type === 'gym') return GYM[p.session].title;
    return 'Repos';
  }
  const slotShort = p => (p.type === 'run' ? (p.adapted === 'stop' ? 'Vélo' : 'Course') : p.type === 'cardio' ? 'Cardio' : p.type === 'gym' ? GYM[p.session].label : 'Repos');
  /* Combien de courses réussies il reste pour passer au niveau suivant. */
  function nextLevelText(rs) {
    if (rs.level >= rs.max) return `Niveau ${rs.max} : c’est le plafond avant l’opération.`;
    const left = 2 - rs.streak;
    return `Encore ${left} course${left > 1 ? 's' : ''} réussie${left > 1 ? 's' : ''} pour passer à ${RUN_LEVELS[rs.level]} min.`;
  }
  function phaseLabel() {
    const rs = rstate();
    return `Niv. ${rs.level} · ${rs.target} min${S.settings.travel ? ' · voyage' : ''}`;
  }

  const STORAGE_ERR = 'Impossible d’enregistrer sur ce téléphone. Vérifie qu’il reste de la place et que la navigation privée est désactivée.';

  /* ---------- Fichiers et texte : partage sur iPhone, sinon téléchargement ou copie ---------- */
  async function shareFile(name, type, text) {
    const blob = new Blob([text], { type });
    try {
      const file = new File([blob], name, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return 'shared'; }
    } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return 'downloaded';
  }
  async function shareText(title, text) {
    try { if (navigator.share) { await navigator.share({ title, text }); return 'shared'; } }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    try { await navigator.clipboard.writeText(text); return 'copied'; } catch (e) { return 'failed'; }
  }

  /* ---------- Rendu ---------- */
  function statusNote() {
    if (!S.storageOk) return `<p class="note warn">${STORAGE_ERR}</p>`;
    return '';
  }
  function installCard() {
    if (isStandalone()) return '';
    try { if (localStorage.getItem('ct-install-later') === '1') return ''; } catch (e) { /* rien */ }
    return `<article class="card install"><p class="eyebrow">À faire une fois</p>
      <h2 class="h3">Installe Cap Trail sur ton iPhone</h2>
      <ol><li>Dans Safari, touche le bouton Partager (le carré avec une flèche).</li><li>Choisis « Sur l’écran d’accueil », puis « Ajouter ».</li><li>Ouvre Cap Trail depuis sa nouvelle icône.</li></ol>
      <p class="muted small">Enregistre tes séances dans l’appli installée : l’icône et Safari ne partagent pas les mêmes données.</p>
      <div><button class="btn ghost" type="button" data-action="install-later">Plus tard</button></div></article>`;
  }
  function backupNudge() {
    const n = S.entries.filter(e => e.kind !== 'checkin').length;
    if (n < 3) return '';
    const last = S.settings.lastBackup;
    const days = last ? daysBetween(last, todayIso()) : null;
    if (days != null && days < 7) return '';
    const txt = days == null ? 'Tu n’as encore jamais sauvegardé tes séances.' : `Dernière sauvegarde il y a ${days} jours.`;
    return `<div class="note backup-note"><span>${txt}</span><button class="btn ghost" type="button" data-action="backup">Sauvegarder</button></div>`;
  }

  function render() {
    $('#phase-pill').textContent = phaseLabel();
    const views = { today: viewToday, journal: viewJournal, progress: viewProgress, plan: viewPlan };
    $('#view').innerHTML = views[S.tab]();
    $$('[data-tab]').forEach(b => { if (b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  }
  function setTab(t) {
    S.tab = t;
    try { localStorage.setItem('ct-tab', t); } catch (e) { /* rien */ }
    render();
    window.scrollTo(0, 0);
  }

  /* ----- Aujourd'hui ----- */
  function viewToday() {
    const t = todayIso();
    const p = planFor(t);
    const rs = rstate();
    const out = [statusNote(), installCard(), backupNudge()];
    out.push(`<div class="hero"><p class="eyebrow">Préparation · niveau ${rs.level} sur ${rs.max}${S.settings.travel ? ' · voyage' : ''}</p><h1 class="display h1">${esc(cap(longDate(t)))}</h1></div>`);
    out.push(checkinCard(p));
    if (showFirstRun(t)) out.push(firstRunCard());
    out.push(planCard(p, t, rs));
    if (p.renfo) out.push(renfoCard(p, t));
    const p2 = planFor(addDays(t, 1));
    out.push(`<p class="tomorrow"><span class="eyebrow">Demain</span><span>${esc(planName(p2))}${p2.renfo ? ' + renfo' : ''}</span></p>`);
    out.push(weekStrip(t));
    out.push(travelRow());
    return out.join('');
  }

  function checkinSummary(ci) {
    const parts = [`douleur au repos ${ci.soreness}/10`];
    if (ci.walk === false) parts.push('tu boites');
    if (ci.stairs === false) parts.push('escaliers douloureux');
    if (ci.neuro) parts.push('fourmillements');
    return parts.join(' · ');
  }
  const neuroAlert = () => '<p class="alert"><b>Fourmillements ou engourdissement :</b> s’ils sont encore là au repos, ou si ton pied a du mal à se relever, consulte un médecin rapidement.</p>';
  function checkinCard(p) {
    const ci = p.checkin;
    if (ci && !S.ciEdit) {
      return `<div class="ci-done ci-${p.color}"><span class="ci-dot" aria-hidden="true"></span>
        <span class="ci-text"><b>Jambes ${COLOR_LABEL[p.color]}</b> · ${esc(checkinSummary(ci))}<br><span class="muted small">${CI_TEXT[p.color]}</span></span>
        <button class="btn ghost" type="button" data-action="ci-edit">Modifier</button></div>${ci.neuro ? neuroAlert() : ''}`;
    }
    if (S.ci && S.ci.date !== p.date) S.ci = null;
    if (!S.ci) S.ci = ci ? { date: p.date, soreness: ci.soreness, walk: ci.walk !== false, stairs: ci.stairs !== false, neuro: !!ci.neuro } : { date: p.date, soreness: null, walk: true, stairs: true, neuro: false };
    const d = S.ci;
    let scale = '<div class="scale">';
    for (let v = 0; v <= 10; v++) scale += `<button type="button" class="b-${ciBand(v)}" data-action="ci-pick" data-k="soreness" data-v="${v}" aria-pressed="${d.soreness === v}" aria-label="${v} sur 10">${v}</button>`;
    scale += '</div>';
    const yn = (k, val) => `<div class="yn" role="group">${[[true, 'Oui'], [false, 'Non']].map(([v, l]) => `<button type="button" data-action="ci-pick" data-k="${k}" data-v="${v}" aria-pressed="${val === v}">${l}</button>`).join('')}</div>`;
    return `<article class="card ci-card">
      <p class="eyebrow">Point jambes du matin</p>
      <h2 class="h3">Comment vont tes jambes&nbsp;?</h2>
      <fieldset class="field"><legend>Courbatures ou douleur au repos (0 à 10)</legend>${scale}</fieldset>
      <div class="ci-q"><span>Tu marches normalement&nbsp;?</span>${yn('walk', d.walk)}</div>
      <div class="ci-q"><span>Tu descends les escaliers sans douleur&nbsp;?</span>${yn('stairs', d.stairs)}</div>
      <div class="ci-q"><span>Fourmillements ou engourdissement&nbsp;?</span>${yn('neuro', d.neuro)}</div>
      <p class="form-error" id="ci-error" hidden></p>
      <div class="row-btns">${ci ? '<button class="btn" type="button" data-action="ci-cancel">Annuler</button>' : ''}<button class="btn primary" type="button" data-action="ci-save">Valider</button></div>
    </article>`;
  }

  function showFirstRun(t) {
    if (t > '2026-11-22' || runs().some(r => r.date <= '2026-11-08')) return false;
    try { return localStorage.getItem('ct-first-later') !== '1'; } catch (e) { return true; }
  }
  function firstRunCard() {
    return `<article class="card"><p class="eyebrow">Ton point de départ</p>
      <h2 class="h3">Ta course du 8 novembre&nbsp;: 4&nbsp;km en 31&nbsp;min</h2>
      <p class="muted">Enregistre-la : elle servira de point de départ, notamment pour le chirurgien.</p>
      <div class="row-btns"><button class="btn ghost" type="button" data-action="first-later">Pas besoin</button><button class="btn primary" type="button" data-action="log-first">L’enregistrer</button></div></article>`;
  }

  function stripHTML(segs) {
    const total = segs.reduce((s, x) => s + x[1], 0);
    const parts = segs.map(([k, m]) => `<span class="s-${k}" style="flex:${m} 1 0"></span>`).join('');
    return `<div class="strip" role="img" aria-label="Déroulé de la séance : ${total} min au total">${parts}</div>
      <div class="strip-legend"><span class="key"><i class="s-r"></i>course</span><span class="key"><i class="s-w"></i>marche avant et après</span><span class="num">${total} min au total</span></div>`;
  }

  function doneRow(e) {
    return `<button class="done-row" type="button" data-action="edit" data-id="${esc(e.id)}">${ICON_CHECK}<span><b>Fait</b> · ${esc(entrySummary(e))}</span></button>`;
  }
  function entrySummary(e) {
    if (e.kind === 'run') {
      const parts = [e.level ? `Course niv. ${e.level}` : (RUNPLANS[e.plan] || 'Course'), `${fmt1(e.durationMin || 0)} min`];
      if (e.distanceKm) parts.push(`${fmt1(e.distanceKm)} km`);
      if (typeof e.pain === 'number') parts.push(`douleur ${e.pain}/10`);
      return parts.join(' · ');
    }
    if (e.kind === 'cardio') return [MACHINES[e.machine] || 'Cardio', `${fmt1(e.durationMin || 0)} min`, INTENS[e.intensity] ? INTENS[e.intensity].toLowerCase() : ''].filter(Boolean).join(' · ');
    if (e.kind === 'renfo') return `Renfo · ${plural((e.items || []).filter(x => x.done).length, 'exercice')}`;
    const parts = [(GYM[e.session] || GYM.autre).title];
    if (e.durationMin) parts.push(`${fmt1(e.durationMin)} min`);
    return parts.join(' · ');
  }
  const addOther = () => '<div><button class="btn ghost" type="button" data-action="new">Ajouter une autre séance</button></div>';

  function planCard(p, t, rs) {
    const todays = sessionsOn(t);
    const head = (label, isDone) => `<div class="plan-top"><span class="blaze" aria-hidden="true"></span><span class="eyebrow">${label}</span>${isDone ? '<span class="done-badge">Fait</span>' : ''}</div>`;
    const rows = list => list.map(doneRow).join('');
    if (p.type === 'run') {
      if (p.adapted === 'stop') {
        const done = todays.filter(e => e.kind === 'run' || e.kind === 'cardio');
        return `<article class="card">${head('Séance du jour', done.length)}
          <h2 class="display h2">Pas de course</h2>
          <p class="target">Tes jambes ont besoin de récupérer. À la place : 15 à 20 min de vélo très facile, ou repos.</p>
          ${done.length ? rows(done) + addOther() : '<button class="btn primary block" type="button" data-action="log-bike">J’ai fait du vélo</button>'}
        </article>`;
      }
      const done = todays.filter(e => e.kind === 'run');
      const where = p.surface === 'tapis' ? 'sur tapis, 9 km/h maximum' : 'dehors, sur du plat';
      const next = nextLevelText(rs);
      const cues = [
        `5 min de marche rapide avant et après${p.mode === 'voyage' ? ' (10 min s’il fait froid)' : ''}`,
        'Arrête-toi dès les premiers signes dans les jambes, même légers, et note au bout de combien de minutes',
        'Petits pas rapides, en posant le milieu du pied',
      ];
      return `<article class="card">${head('Séance du jour', done.length)}
        <div class="title-group"><h2 class="display h2">Course de ${p.minutes} min</h2><p class="kind-sub">En continu · ${where}</p></div>
        ${p.adapted === 'short' ? `<p class="note warn">Jambes orange : course raccourcie à ${p.minutes} min au lieu de ${p.full}.</p>` : ''}
        ${!p.checkin ? '<p class="note">Fais d’abord le point jambes ci-dessus.</p>' : ''}
        ${stripHTML([['w', 5], ['r', p.minutes], ['w', 5]])}
        <ul class="cues">${cues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
        <p class="muted small">${esc(next)}</p>
        ${done.length ? rows(done) + addOther() : '<button class="btn primary block" type="button" data-action="log-plan">J’ai fait cette course</button>'}
      </article>`;
    }
    if (p.type === 'cardio') {
      const done = todays.filter(e => e.kind === 'cardio' || e.kind === 'run');
      const line = p.adapted === 'easy' ? 'Jambes rouges : 15 à 20 min de vélo très facile, ou repos.'
        : p.mode === 'voyage' ? '40 à 60 min de marche rapide, ou de vélo ou de natation si tu y as accès. Tu dois pouvoir parler.'
        : '30 à 40 min à une allure où tu peux parler : vélo, rameur ou elliptique. Si une machine réveille tes loges, passe au vélo.';
      return `<article class="card">${head('Séance du jour', done.length)}
        <div class="title-group"><h2 class="display h2">Cardio sans choc</h2><p class="kind-sub">Le souffle, sans les chocs de la course</p></div>
        <p class="target">${esc(line)}</p>
        ${done.length ? rows(done) + addOther() : '<button class="btn primary block" type="button" data-action="log-plan">J’ai fait cette séance</button>'}
      </article>`;
    }
    if (p.type === 'gym') {
      const g = GYM[p.session];
      const done = todays.filter(e => e.kind === 'gym');
      const legsDay = ['legs', 'pdcA', 'pdcB'].includes(p.session);
      const warn = legsDay && p.color === 'red' ? 'Jambes rouges : garde le haut du corps et saute les exercices de jambes, ou décale la séance.'
        : legsDay && p.color === 'orange' ? 'Jambes orange : exercices de jambes plus légers, sans travail des mollets.' : '';
      return `<article class="card">${head(`Séance du jour · ${p.mode === 'voyage' ? 'sans salle' : 'salle'}`, done.length)}
        <h2 class="display h2">${esc(g.title)}</h2>
        <p class="target">${esc(g.line)}</p>
        ${warn ? `<p class="note warn">${esc(warn)}</p>` : ''}
        ${g.ex ? `<ul class="ex-plan">${g.ex.map(([n, r]) => `<li><span>${esc(n)}</span><span>${esc(r)}</span></li>`).join('')}</ul>` : ''}
        ${done.length ? rows(done) + addOther() : '<button class="btn gymb block" type="button" data-action="log-plan">J’ai fait cette séance</button>'}
      </article>`;
    }
    return `<article class="card">${head('Jour de repos', false)}
      <h2 class="display h2">Repos</h2>
      <p class="target">Récupération complète. Si tu en as envie, 20 min d’étirements et de mobilité.</p>
      ${todays.length ? rows(todays) : ''}
    </article>`;
  }

  /* Exercices de renfo du jour, adaptés au point jambes. */
  function renfoItems(color) {
    const items = [];
    let isoAdded = false;
    RENFO.forEach(r => {
      if (r.calf && color === 'red') return;
      if (r.calf && color === 'orange') {
        if (!isoAdded) { items.push({ ex: 'iso', name: ISO.name, how: ISO.how, reps: ISO.reps, level: null }); isoAdded = true; }
        return;
      }
      const lv = renfoLevel(r.id);
      const [how, reps] = r.levels[lv - 1];
      items.push({ ex: r.id, name: r.name, how, reps, level: lv });
    });
    return items;
  }
  function renfoCard(p, t) {
    const done = sessionsOn(t).filter(e => e.kind === 'renfo');
    const items = renfoItems(p.color);
    const note = p.color === 'red' ? 'Jambes rouges : pas de mollets aujourd’hui.' : p.color === 'orange' ? 'Jambes orange : mollets en tenue immobile seulement.' : '';
    return `<article class="card">
      <div class="plan-top"><span class="eyebrow">Renfo jambes · 15 min</span>${done.length ? '<span class="done-badge">Fait</span>' : ''}</div>
      ${note ? `<p class="note warn">${esc(note)}</p>` : ''}
      <ul class="renfo-list">${items.map(it => `<li><span class="rl-main"><b>${esc(it.name)}</b><span class="muted small">${esc(it.how)}</span></span><span class="rl-side">${esc(it.reps)}${it.level ? `<span class="muted small">niv. ${it.level}</span>` : ''}</span></li>`).join('')}</ul>
      <p class="muted small">Douleur 3/10 maximum. Un exercice noté « trop facile » deux fois de suite passe au niveau suivant.</p>
      ${done.length ? done.map(doneRow).join('') : '<button class="btn gymb block" type="button" data-action="log-renfo">Renfo fait</button>'}
    </article>`;
  }

  function weekStrip(t) {
    const monday = mondayOf(t);
    const cells = [];
    for (let k = 0; k < 7; k++) {
      const d = addDays(monday, k);
      const p = planFor(d);
      const es = sessionsOn(d);
      const done = p.type === 'run' || p.type === 'cardio' ? es.some(e => e.kind === 'run' || e.kind === 'cardio')
        : p.type === 'gym' ? es.some(e => e.kind === 'gym') : false;
      let st;
      if (p.type === 'rest') st = es.length ? 'extra' : 'rest';
      else if (done) st = 'done';
      else if (d < t) st = 'missed';
      else st = 'todo';
      const inner = st === 'done' ? ICON_CHECK : st === 'missed' ? '<i class="dash"></i>' : st === 'extra' ? '<i class="dot"></i>' : '';
      const stTxt = st === 'done' ? 'fait' : st === 'missed' ? 'pas fait' : st === 'extra' ? 'séance en plus' : '';
      cells.push(`<div class="day st-${st}${d === t ? ' today' : ''}" title="${esc(cap(longDate(d)))} : ${esc(planName(p))}${p.renfo ? ' + renfo' : ''}${stTxt ? ' (' + stTxt + ')' : ''}">
        <span class="dl">${DAYS_SHORT[k]}</span><span class="dn">${parse(d).getDate()}</span>
        <span class="ds ${p.type} ${st}">${inner}</span><span class="dp">${esc(slotShort(p))}</span></div>`);
    }
    return `<section class="block"><div class="block-head"><h2 class="h3">Cette semaine</h2><span class="muted small">Renfo mardi et jeudi</span></div><div class="week">${cells.join('')}</div></section>`;
  }

  function travelRow() {
    const on = !!S.settings.travel;
    return `<div class="travel-row"><span><b>Mode voyage</b><br><span class="muted small">Séances au poids du corps, sans salle</span></span>
      <button class="switch" type="button" role="switch" aria-checked="${on}" aria-label="Mode voyage" data-action="travel"><span></span></button></div>`;
  }

  /* ----- Journal ----- */
  const painBadge = p => `<span class="painb p-${band(p)}"><b>${p}</b><small>/10</small></span>`;
  function runMeta(e) {
    const parts = [`${fmt1(e.durationMin || 0)} min`];
    if (e.distanceKm) { parts.push(`${fmt1(e.distanceKm)} km`); const v = kmh(e.durationMin, e.distanceKm); if (v) parts.push(`${fmt1(v)} km/h`); }
    if (e.elevGain) parts.push(`D+ ${Math.round(e.elevGain)} m`);
    if (e.painOnsetMin) parts.push(`symptômes à ${fmt1(e.painOnsetMin)} min`);
    const zones = (e.zones || []).map(z => ZONES[z] || z);
    if (zones.length && ((e.pain || 0) > 0 || e.painOnsetMin)) parts.push((zones.join(', ') + (SIDES[e.side] ? ` (${SIDES[e.side]})` : '')).toLowerCase());
    if (e.neuro) parts.push('fourmillements');
    if (e.nextDay && NEXT[e.nextDay]) parts.push(`lendemain : ${NEXT[e.nextDay].toLowerCase()}`);
    return parts.join(' · ');
  }
  function cardioMeta(e) {
    const parts = [`${fmt1(e.durationMin || 0)} min`];
    if (INTENS[e.intensity]) parts.push(INTENS[e.intensity].toLowerCase());
    return parts.join(' · ');
  }
  function renfoMeta(e) {
    const items = (e.items || []).filter(x => x.done);
    const parts = [plural(items.length, 'exercice')];
    const calf = items.find(x => x.ex === 'mollet');
    if (calf && calf.level) parts.push(`mollets niv. ${calf.level}`);
    if (items.some(x => x.ex === 'iso')) parts.push('mollets en tenue');
    return parts.join(' · ');
  }
  function gymMeta(e) {
    const parts = [];
    if (e.durationMin) parts.push(`${fmt1(e.durationMin)} min`);
    const n = Array.isArray(e.exercises) ? e.exercises.filter(x => x && x.name).length : 0;
    if (n) parts.push(plural(n, 'exercice'));
    if (e.rpe) parts.push(`difficulté ${e.rpe}/10`);
    return parts.join(' · ') || 'Séance enregistrée';
  }
  function entryRow(e) {
    let tag, meta, right = '<span></span>';
    if (e.kind === 'run') {
      tag = `<span class="tag run">${esc(e.level ? `Course · niv. ${e.level}` : RUNPLANS[e.plan] || 'Course')}</span><span class="where">${esc(SURF[e.surface] || '')}</span>`;
      meta = runMeta(e);
      if (typeof e.pain === 'number') right = painBadge(e.pain);
    } else if (e.kind === 'cardio') {
      tag = `<span class="tag cardio">Cardio</span><span class="where">${esc(MACHINES[e.machine] || '')}</span>`;
      meta = cardioMeta(e);
      if (e.pain > 0) right = painBadge(e.pain);
    } else if (e.kind === 'renfo') {
      tag = '<span class="tag renfo">Renfo jambes</span>';
      meta = renfoMeta(e);
      if (e.pain > 0) right = painBadge(e.pain);
    } else {
      tag = `<span class="tag gym">${esc((GYM[e.session] || GYM.autre).title)}</span>`;
      meta = gymMeta(e);
    }
    return `<button class="entry" type="button" data-action="edit" data-id="${esc(e.id)}">
      <span class="edate"><span class="d">${DAYS_3[dow(e.date)]}</span><span class="n">${parse(e.date).getDate()}</span></span>
      <span class="emain"><span class="etitle">${tag}</span><span class="emeta">${esc(meta)}</span>${e.notes ? `<span class="enotes">${esc(e.notes)}</span>` : ''}</span>
      ${right}</button>`;
  }
  function viewJournal() {
    const list = S.entries.filter(e => e.kind !== 'checkin' && (S.filter === 'all' || e.kind === S.filter)).sort(byDateDesc);
    const filters = [['all', 'Tout'], ['run', 'Course'], ['renfo', 'Renfo'], ['cardio', 'Cardio'], ['gym', 'Salle']]
      .map(([v, l]) => `<button type="button" data-action="filter" data-v="${v}" aria-pressed="${S.filter === v}">${l}</button>`).join('');
    const out = [statusNote(), `<div class="view-head"><h1 class="display h1">Journal</h1><div class="seg" role="group" aria-label="Filtrer">${filters}</div></div>`];
    if (!list.length) {
      const what = { all: 'Aucune séance', run: 'Aucune course', renfo: 'Aucun renfo', cardio: 'Aucun cardio', gym: 'Aucune séance de salle' }[S.filter];
      out.push(`<div class="empty"><p class="h3">${what} pour l’instant</p>
        <p class="muted">Chaque séance que tu enregistres apparaît ici, semaine par semaine, avec ta douleur max.</p>
        <button class="btn primary" type="button" data-action="new">Ajouter une séance</button></div>`);
      out.push(dataBlock());
      return out.join('');
    }
    const groups = new Map();
    list.forEach(e => { const m = mondayOf(e.date); if (!groups.has(m)) groups.set(m, []); groups.get(m).push(e); });
    groups.forEach((es, m) => {
      const count = k => es.filter(e => e.kind === k).length;
      const mins = es.filter(e => e.kind === 'run').reduce((s, e) => s + (e.durationMin || 0), 0);
      const sum = [
        count('run') ? `${plural(count('run'), 'course')} · ${fmt1(mins)} min` : '',
        count('renfo') ? `${count('renfo')} renfo` : '',
        count('cardio') ? `${count('cardio')} cardio` : '',
        count('gym') ? `${count('gym')} salle` : '',
      ].filter(Boolean).join(' · ');
      out.push(`<section class="wk"><div class="wk-head"><span>Semaine du ${shortDate(m)}</span><span>${esc(sum)}</span></div>${es.map(entryRow).join('')}</section>`);
    });
    out.push(`<div class="block"><button class="btn" type="button" data-action="export">Exporter en CSV</button>
      <p class="muted small">Toutes tes séances dans un tableau, à garder ou à envoyer.</p></div>`);
    out.push(dataBlock());
    return out.join('');
  }
  function dataBlock() {
    const last = S.settings.lastBackup;
    return `<section class="block"><h2 class="h3">Tes données</h2>
      <p class="muted small">Tout reste sur ce téléphone. Fais une sauvegarde chaque semaine et garde-la dans Fichiers ou iCloud Drive : si tu supprimes l’appli, tes séances partent avec elle.</p>
      <p class="small">${last ? `Dernière sauvegarde : ${esc(longDate(last))}.` : 'Aucune sauvegarde pour l’instant.'}</p>
      <div class="data-actions"><button class="btn" type="button" data-action="backup">Sauvegarder</button><button class="btn" type="button" data-action="restore">Restaurer une sauvegarde</button></div></section>`;
  }

  /* ----- Progrès ----- */
  function viewProgress() {
    const t = todayIso();
    const mon = mondayOf(t), end = addDays(mon, 6);
    const planned = { run: 0, cardio: 0, gym: 0, renfo: 0 };
    let plannedMin = 0;
    for (let k = 0; k < 7; k++) {
      const p = planFor(addDays(mon, k));
      if (p.type === 'run') { planned.run += 1; plannedMin += p.full; }
      if (p.type === 'cardio') planned.cardio += 1;
      if (p.type === 'gym') planned.gym += 1;
      if (p.renfo) planned.renfo += 1;
    }
    const inWeek = k => S.entries.filter(e => e.kind === k && e.date >= mon && e.date <= end);
    const wr = inWeek('run');
    const wmin = wr.reduce((s, e) => s + (e.durationMin || 0), 0);
    const rs = rstate();
    const tile = (v, of, label, sub) => `<div class="tile"><span class="v">${v}<small>/${of}</small>${sub ? `<small class="sub">${sub}</small>` : ''}</span><span class="l">${label}</span></div>`;
    const out = [statusNote(), '<div class="view-head"><h1 class="display h1">Progrès</h1></div>'];
    out.push(`<section class="block"><div class="block-head"><h2 class="h3">Cette semaine</h2><span class="muted small">${shortDate(mon)} – ${shortDate(end)}</span></div>
      <div class="tiles four">
        ${tile(wr.length, planned.run, `courses · ${Math.round(wmin)} min sur ${plannedMin}`)}
        ${tile(inWeek('renfo').length, planned.renfo, 'renfos jambes')}
        ${tile(inWeek('cardio').length, planned.cardio, 'cardio sans choc')}
        ${tile(inWeek('gym').length, planned.gym, S.settings.travel ? 'séances poids du corps' : 'séances de salle')}
      </div></section>`);
    out.push(`<section class="block"><div class="block-head"><h2 class="h3">Niveau de course</h2><span class="muted small">${rs.target} min en continu</span></div>
      <div class="ladder" role="img" aria-label="Niveau ${rs.level} sur ${rs.max}">${RUN_LEVELS.map((m, i) => `<span class="rung${i < rs.level ? ' on' : ''}${i === rs.level - 1 ? ' cur' : ''}">${m}</span>`).join('')}</div>
      <p class="muted small">${esc(rs.level < rs.max ? nextLevelText(rs) : 'Plafond atteint : on reste à 20 min jusqu’à l’opération.')}</p></section>`);
    out.push(`<section class="block"><div class="block-head"><h2 class="h3">Tes courses</h2></div>
      ${runs().length ? `<div class="legend"><span><i class="sw"></i>minutes courues</span><span><i class="tk"></i>objectif du niveau</span><span><i class="od"></i>premiers symptômes</span></div><div class="chart">${runsChart()}</div>`
        : '<p class="muted">Tes courses apparaîtront ici, avec l’objectif du niveau et le moment où les symptômes arrivent.</p>'}
    </section>`);
    if (runs().some(r => typeof r.pain === 'number')) {
      out.push(`<section class="block"><div class="block-head"><h2 class="h3">Douleur max par sortie</h2></div>
        <div class="legend"><span><i class="th"></i>à partir de 4/10, le niveau redescend</span></div><div class="chart">${painChart()}</div></section>`);
    }
    out.push(summaryBlock());
    out.push(recordsBlock());
    return out.join('');
  }

  function barPath(x, base, w, h, r) {
    r = Math.min(r, h, w / 2);
    return `M${x},${base} V${base - h + r} Q${x},${base - h} ${x + r},${base - h} H${x + w - r} Q${x + w},${base - h} ${x + w},${base - h + r} V${base} Z`;
  }
  function runsChart() {
    const rs = runs().slice().sort(byDateAsc).slice(-12);
    const ver = rstate().verdicts;
    const W = 360, H = 180, L = 30, R = 8, T = 12, B = 26;
    const maxV = Math.max(10, ...rs.map(r => Math.max(r.durationMin || 0, (ver[r.id] || {}).target || 0, r.painOnsetMin || 0)));
    const step = maxV <= 20 ? 5 : maxV <= 40 ? 10 : 15;
    const top = Math.ceil(maxV / step) * step;
    const y = v => T + (H - T - B) * (1 - Math.min(v, top) / top);
    const base = y(0);
    const slots = Math.max(rs.length, 6);
    const bw = (W - L - R) / slots;
    const barW = Math.min(22, bw * 0.55);
    const n = rs.length;
    const labelIdx = new Set(n <= 6 ? rs.map((_, i) => i) : [0, n - 1, Math.floor((n - 1) / 2)]);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Durée de chaque course, objectif du niveau et premiers symptômes">`;
    for (let v = 0; v <= top; v += step) {
      s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
    }
    rs.forEach((r, i) => {
      const cx = L + bw * i + bw / 2;
      const v = ver[r.id];
      const dur = r.durationMin || 0;
      if (dur > 0) s += `<path class="bar" d="${barPath(cx - barW / 2, base, barW, base - y(dur), 4)}"/>`;
      if (v && v.target) s += `<line class="plan-tick" x1="${cx - bw * 0.36}" x2="${cx + bw * 0.36}" y1="${y(v.target)}" y2="${y(v.target)}"/>`;
      if (r.painOnsetMin > 0) s += `<circle class="onset" cx="${cx}" cy="${y(r.painOnsetMin)}" r="5"/>`;
      if (labelIdx.has(i)) s += `<text class="ax" x="${cx}" y="${H - 8}" text-anchor="middle">${esc(shortDate(r.date).replace('.', ''))}</text>`;
      const tip = `${shortDate(r.date)} : ${fmt1(dur)} min${v ? ` · objectif ${v.target} min` : ''}${r.painOnsetMin ? ` · symptômes à ${fmt1(r.painOnsetMin)} min` : ''}`;
      const ty = Math.min(y(dur), v ? y(v.target) : base, r.painOnsetMin ? y(r.painOnsetMin) : base);
      s += `<rect class="hit" x="${L + bw * i}" y="${T}" width="${bw}" height="${base - T}" data-tip="${esc(tip)}" data-x="${cx}" data-y="${ty}"/>`;
    });
    return s + '</svg>';
  }
  function painChart() {
    const rs = runs().slice().sort(byDateAsc).filter(r => typeof r.pain === 'number').slice(-20);
    const W = 360, H = 172, L = 24, R = 10, T = 10, B = 26;
    const x = i => (rs.length === 1 ? (L + W - R) / 2 : L + 8 + i * (W - L - R - 16) / (rs.length - 1));
    const y = v => T + (H - T - B) * (1 - v / 10);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Douleur maximale par sortie, sur 10">`;
    [0, 2, 4, 6, 8, 10].forEach(v => { s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`; });
    s += `<line class="thr" x1="${L}" x2="${W - R}" y1="${y(4)}" y2="${y(4)}"/>`;
    if (rs.length > 1) s += `<path class="trend" d="${rs.map((r, i) => `${i ? 'L' : 'M'}${x(i)},${y(r.pain)}`).join(' ')}"/>`;
    const labelIdx = new Set([0, rs.length - 1]);
    if (rs.length >= 7) labelIdx.add(Math.floor((rs.length - 1) / 2));
    rs.forEach((r, i) => {
      s += `<circle class="dot ${band(r.pain)}" cx="${x(i)}" cy="${y(r.pain)}" r="5.5"/>`;
      if (labelIdx.has(i)) s += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="${rs.length > 1 && i === 0 ? 'start' : rs.length > 1 && i === rs.length - 1 ? 'end' : 'middle'}">${esc(shortDate(r.date).replace('.', ''))}</text>`;
      const zones = (r.zones || []).length && r.pain > 0 ? ` (${r.zones.map(z => (ZONES[z] || z).toLowerCase()).join(', ')})` : '';
      const tip = `${shortDate(r.date)} · ${fmt1(r.durationMin || 0)} min · ${r.pain}/10${zones}`;
      s += `<circle class="hit" cx="${x(i)}" cy="${y(r.pain)}" r="14" data-tip="${esc(tip)}" data-x="${x(i)}" data-y="${y(r.pain) - 4}"/>`;
    });
    return s + '</svg>';
  }

  /* Résumé pour le chirurgien : ce qui l'aide à comprendre tes loges. */
  function summaryLines() {
    const rs = runs().filter(r => typeof r.durationMin === 'number').sort(byDateAsc);
    if (!rs.length) return null;
    const sym = rs.filter(r => (r.pain || 0) > 0 || r.painOnsetMin > 0);
    const onsets = rs.map(r => r.painOnsetMin).filter(v => v > 0);
    const gones = rs.map(r => r.painGoneMin).filter(v => typeof v === 'number' && v >= 0);
    const pains = rs.map(r => r.pain).filter(v => typeof v === 'number');
    const zones = {};
    sym.forEach(r => (r.zones || []).forEach(z => {
      const k = ZONES[z] || z;
      zones[k] = zones[k] || { n: 0, sides: {} };
      zones[k].n += 1;
      if (SIDE_TXT[r.side]) { const sd = SIDE_TXT[r.side]; zones[k].sides[sd] = (zones[k].sides[sd] || 0) + 1; }
    }));
    const zoneTxt = Object.entries(zones).sort((a, b) => b[1].n - a[1].n)
      .map(([k, v]) => {
        const sides = Object.entries(v.sides);
        const where = !sides.length ? '' : sides.length === 1 && sides[0][1] === v.n ? `, ${sides[0][0]}` : ` (${sides.map(([sd, c]) => `${sd} ${c}`).join(', ')})`;
        return `${k} : ${v.n} fois${where}`;
      }).join(' ; ');
    const neuro = rs.filter(r => r.neuro);
    const hard = rs.filter(r => ciColor(checkinOn(S.entries, addDays(r.date, 1))) === 'red').length;
    const strikes = {};
    rs.forEach(r => { if (STRIKES[r.strike]) strikes[STRIKES[r.strike]] = (strikes[STRIKES[r.strike]] || 0) + 1; });
    const lines = [
      ['Période', `du ${longDate(rs[0].date)} au ${longDate(rs[rs.length - 1].date)}`],
      ['Sorties', `${rs.length}, dont ${sym.length} avec des symptômes`],
      ['Symptômes apparus après', !onsets.length ? 'non noté' : onsets.length === 1 ? `${fmt1(onsets[0])} min (1 sortie)`
        : `${fmt1(avg(onsets))} min en moyenne (de ${fmt1(Math.min(...onsets))} à ${fmt1(Math.max(...onsets))} min)`],
      ['Disparus après l’arrêt', gones.length ? `${fmt1(avg(gones))} min en moyenne` : 'non noté'],
      ['Zones', zoneTxt || 'aucune notée'],
      ['Douleur max moyenne', pains.length ? `${fmt1(avg(pains))}/10` : 'non notée'],
      ['Fourmillements ou engourdissement', neuro.length ? `${neuro.length} fois (${neuro.map(r => shortDate(r.date)).join(', ')})` : 'jamais'],
      ['Lendemains difficiles (jambes rouges)', `${hard} sur ${rs.length} sorties`],
    ];
    if (Object.keys(strikes).length) lines.push(['Foulée', Object.entries(strikes).map(([k, c]) => `${k.toLowerCase()} ×${c}`).join(', ')]);
    return lines;
  }
  function summaryBlock() {
    const lines = summaryLines();
    if (!lines) return '';
    return `<section class="block"><div class="block-head"><h2 class="h3">Résumé pour le chirurgien</h2></div>
      <dl class="records long">${lines.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      <div><button class="btn" type="button" data-action="share-summary">Partager le résumé</button></div></section>`;
  }
  async function shareSummary() {
    const lines = summaryLines();
    if (!lines) return;
    const text = `Cap Trail · résumé de mes courses (${longDate(todayIso())})\n` + lines.map(([k, v]) => `${k} : ${v}`).join('\n');
    const r = await shareText('Résumé Cap Trail', text);
    if (r === 'copied') toast('Résumé copié');
    else if (r === 'failed') toast('Partage impossible ici');
  }
  function recordsBlock() {
    const rs = runs(), gs = ofKind('gym'), cs = ofKind('cardio'), fs = ofKind('renfo');
    if (!rs.length && !gs.length && !cs.length && !fs.length) return '';
    const rows = [];
    if (rs.length) {
      const longest = rs.reduce((m, r) => ((r.durationMin || 0) > (m.durationMin || 0) ? r : m), rs[0]);
      rows.push(['Plus longue course', `${fmt1(longest.durationMin || 0)} min · ${shortDate(longest.date)}`]);
      const totMin = rs.reduce((s, r) => s + (r.durationMin || 0), 0);
      const totKm = rs.filter(r => r.distanceKm > 0).reduce((s, r) => s + r.distanceKm, 0);
      rows.push(['Total couru', `${fmtDur(totMin)}${totKm ? ` · ${fmt1(totKm)} km` : ''}`]);
    }
    if (cs.length) rows.push(['Cardio sans choc', fmtDur(cs.reduce((s, e) => s + (e.durationMin || 0), 0))]);
    rows.push(['Renfos jambes', String(fs.length)]);
    rows.push(['Séances de salle', String(gs.length)]);
    return `<section class="block"><h2 class="h3">Depuis le début</h2><dl class="records">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section>`;
  }

  /* ----- Programme ----- */
  function viewPlan() {
    const rs = rstate();
    const levelRows = RUN_LEVELS.map((m, i) => `<tr class="${i === rs.level - 1 ? 'current' : ''}"><td class="nw">Niveau ${i + 1}</td><td>${m} min de course${i === RUN_LEVELS.length - 1 ? ' (plafond avant l’opération)' : ''}</td></tr>`).join('');
    const nm = x => (x === 'rest' ? 'Repos' : x === 'run' ? 'Course courte' : x === 'cardio' ? 'Cardio sans choc' : GYM[x].title);
    const dayRows = DAYS.map((d, k) => {
      const plus = RENFO_DAYS.includes(k) ? ' + renfo' : '';
      return `<tr><td>${cap(d)}</td><td>${esc(nm(TEMPLATES.salle[k]))}${plus}</td><td>${esc(nm(TEMPLATES.voyage[k]))}${plus}</td></tr>`;
    }).join('');
    const renfoRows = RENFO.map(r => {
      const lv = renfoLevel(r.id);
      const [how, reps] = r.levels[lv - 1];
      return `<tr><td><b>${esc(r.name)}</b><br><span class="muted small">${esc(how)} · ${esc(reps)}</span></td>
        <td class="lvl-cell"><div class="stepper"><button type="button" class="icon-btn sm" data-action="renfo-lvl" data-ex="${r.id}" data-d="-1" aria-label="Niveau précédent" ${lv <= 1 ? 'disabled' : ''}>−</button><span>${lv}/${r.levels.length}</span><button type="button" class="icon-btn sm" data-action="renfo-lvl" data-ex="${r.id}" data-d="1" aria-label="Niveau suivant" ${lv >= r.levels.length ? 'disabled' : ''}>+</button></div></td></tr>`;
    }).join('');
    const pdc = k => `<ul class="ex-plan">${GYM[k].ex.map(([n, r]) => `<li><span>${esc(n)}</span><span>${esc(r)}</span></li>`).join('')}</ul>`;
    return `<div class="view-head"><h1 class="display h1">Programme</h1>
        <p class="muted">Avant l’opération, le but est de préparer ton corps à courir sans réveiller tes loges : de la force, du souffle et de petites doses de course.</p></div>
      <section class="block"><h2 class="h3">Les 4 axes</h2>
        <ol class="axes">
          <li><b>Force</b> : mollets, tendon d’Achille, releveurs du pied, fessiers. C’est ce qui se garde le mieux pendant la convalescence.</li>
          <li><b>Cardio sans choc</b> : vélo, rameur ou elliptique, pour le souffle.</li>
          <li><b>Courses courtes</b> en continu, arrêtées avant les symptômes, pour habituer tendons et os aux chocs.</li>
          <li><b>Technique</b> : petits pas rapides, en posant le milieu du pied.</li>
        </ol></section>
      <section class="block"><h2 class="h3">Ton niveau de course</h2>
        <div class="tbl-wrap"><table><tbody>${levelRows}</tbody></table></div>
        <p class="small"><b>Pour monter :</b> 2 courses d’affilée tenues jusqu’au bout, avec 2/10 de douleur maximum et des jambes vertes le lendemain.</p>
        <p class="small"><b>Pour redescendre :</b> douleur de 4/10 ou plus, symptômes avant la fin, fourmillements, ou jambes rouges le lendemain.</p>
        <div class="row-btns"><button class="btn" type="button" data-action="lvl" data-d="-1" ${rs.level <= 1 ? 'disabled' : ''}>Descendre d’un niveau</button><button class="btn" type="button" data-action="lvl" data-d="1" ${rs.level >= rs.max ? 'disabled' : ''}>Monter d’un niveau</button></div>
      </section>
      <section class="block"><h2 class="h3">Le point jambes du matin</h2>
        <div class="rules wide">
          <div class="rule"><span class="painb p-ok"><b>Vert</b></span><p>Douleur au repos de 0 à 2, tu marches et descends les escaliers normalement : séance normale.</p></div>
          <div class="rule"><span class="painb p-warn"><b>Orange</b></span><p>Douleur de 3 ou 4, ou escaliers douloureux : course divisée par deux, mollets en tenue immobile.</p></div>
          <div class="rule"><span class="painb p-bad"><b>Rouge</b></span><p>Douleur de 5 ou plus, tu boites, ou fourmillements : pas de course ni de mollets. Vélo très facile ou repos.</p></div>
        </div></section>
      <section class="block"><h2 class="h3">Pendant la course</h2>
        <ul class="cues">
          <li>5 min de marche rapide avant et après.</li>
          <li>Une allure où tu peux parler. Sur tapis : 1 % de pente, 9 km/h maximum.</li>
          <li>Petits pas rapides (170 à 180 par minute), en posant le milieu du pied.</li>
          <li>Arrête-toi dès les premiers signes dans les jambes, même légers, et note au bout de combien de minutes.</li>
        </ul></section>
      <section class="block"><h2 class="h3">Ta semaine type</h2>
        <div class="tbl-wrap"><table><thead><tr><th>Jour</th><th>Salle</th><th>Voyage</th></tr></thead><tbody>${dayRows}</tbody></table></div>
        ${travelRow()}
      </section>
      <section class="block"><h2 class="h3">Renfo jambes</h2>
        <p class="muted small">15 min le mardi et le jeudi, douleur 3/10 maximum. Un exercice noté « trop facile » deux fois de suite monte d’un niveau. Tu peux aussi changer le niveau ici.</p>
        <div class="tbl-wrap"><table><tbody>${renfoRows}</tbody></table></div>
      </section>
      <section class="block"><h2 class="h3">Cardio sans choc</h2>
        <p>30 à 40 min, à une allure où tu peux parler. Le vélo est souvent le mieux toléré : si le rameur ou l’elliptique réveille des symptômes, reste sur le vélo. En voyage : marche rapide, vélo ou natation.</p></section>
      <section class="block"><h2 class="h3">En voyage, au poids du corps</h2>
        <p class="muted small">4 tours, 90 s de repos entre les tours. Pas de sauts pour l’instant.</p>
        <p class="eyebrow">A · poussée + jambes</p>${pdc('pdcA')}
        <p class="eyebrow">B · tirage + jambes</p>${pdc('pdcB')}
      </section>
      <p class="alert"><b>À montrer vite à un médecin :</b> engourdissement ou fourmillements qui restent après l’arrêt, pied qui tombe, douleur qui ne baisse pas après 30 min de repos, mollet très dur ou gonflé au repos, un seul mollet chaud ou rouge.</p>
      <a class="btn block" href="${DOC_URL}" target="_blank" rel="noopener">Ouvrir le document du programme</a>`;
  }

  /* ---------- Formulaire ---------- */
  function blankForm(kind) {
    return { id: null, kind, date: todayIso(), plan: 'niveau', level: null, surface: S.settings.travel ? 'route' : 'tapis',
      dur: null, dist: null, elev: null, pain: null, zones: [], side: null, onset: null, gone: null, neuro: false, strike: null, nextDay: null, renfoOld: false,
      machine: null, intensity: 'facile', items: [], session: null, rpe: null, exercises: [], notes: '', createdAt: null,
      source: 'manuel', exTouched: false, confirmDelete: false };
  }
  function defaultExercises(session) {
    const g = GYM[session];
    if (g && g.ex) return g.ex.map(([name, scheme]) => ({ name, scheme, kg: '' }));
    const last = ofKind('gym').filter(e => e.session === session && Array.isArray(e.exercises) && e.exercises.length).sort(byDateDesc)[0];
    if (last) return last.exercises.map(x => ({ name: x.name || '', scheme: x.scheme || '', kg: '', lastKg: x.kg || '' }));
    return [];
  }
  const renfoFormItems = color => renfoItems(color).map(it => ({ ex: it.ex, level: it.level, done: true, easy: false }));
  function formFromPlan() {
    const p = planFor(todayIso());
    if (p.type === 'run') return { ...blankForm('run'), surface: p.surface, dur: p.minutes, strike: 'milieu' };
    if (p.type === 'cardio') return { ...blankForm('cardio'), machine: p.mode === 'voyage' ? 'marche' : 'velo', dur: p.adapted === 'easy' ? 20 : p.mode === 'voyage' ? 45 : 35 };
    if (p.type === 'gym') return { ...blankForm('gym'), session: p.session, dur: p.session.startsWith('pdc') ? 40 : 75, exercises: defaultExercises(p.session) };
    return blankForm('run');
  }
  const formForRenfo = () => ({ ...blankForm('renfo'), items: renfoFormItems(planFor(todayIso()).color) });
  const formForBike = () => ({ ...blankForm('cardio'), machine: 'velo', dur: 20, intensity: 'facile' });
  function formForNew() {
    const t = todayIso(); const p = planFor(t); const es = sessionsOn(t);
    const has = kinds => es.some(e => kinds.includes(e.kind));
    if (p.type === 'run' && p.adapted === 'stop') { if (!has(['cardio', 'run'])) return formForBike(); }
    else if ((p.type === 'run' || p.type === 'cardio') && !has(['run', 'cardio'])) return formFromPlan();
    else if (p.type === 'gym' && !has(['gym'])) return formFromPlan();
    if (p.renfo && !has(['renfo'])) return formForRenfo();
    return blankForm('run');
  }
  function firstRunForm() {
    return { ...blankForm('run'), date: '2026-11-08', plan: 'libre', surface: 'tapis', dur: 31, dist: 4, zones: ['mollet'], strike: 'avant',
      notes: 'Première sortie. En attaquant sur l’avant du pied : plus de douleur au tibia, un peu au mollet à la fin.' };
  }
  function formFromEntry(e) {
    return { ...blankForm(e.kind), id: e.id, date: e.date, plan: e.plan || 'niveau', level: e.level ?? null, surface: e.surface || 'tapis',
      dur: e.durationMin ?? null, dist: e.distanceKm ?? null, elev: e.elevGain ?? null, pain: typeof e.pain === 'number' ? e.pain : null,
      zones: Array.isArray(e.zones) ? e.zones.slice() : [], side: e.side || null, onset: e.painOnsetMin ?? null, gone: e.painGoneMin ?? null,
      neuro: !!e.neuro, strike: e.strike || null, nextDay: e.nextDay ?? null, renfoOld: !!e.renfo,
      machine: e.machine || null, intensity: e.intensity || 'facile', items: Array.isArray(e.items) ? e.items.map(x => ({ ...x })) : [],
      session: e.session || null, rpe: e.rpe ?? null,
      exercises: Array.isArray(e.exercises) ? e.exercises.map(x => ({ name: x.name || '', scheme: x.scheme || '', kg: x.kg || '' })) : [],
      notes: e.notes || '', createdAt: e.createdAt || null, source: e.source || 'manuel', exTouched: true };
  }

  function chipGroup(group, options, current, multi) {
    return `<div class="chips">${options.map(([v, l]) => {
      const on = multi ? current.includes(v) : current === v;
      return `<button class="chip-btn" type="button" data-action="pick" data-group="${group}" data-v="${v}" aria-pressed="${on}">${esc(l)}</button>`;
    }).join('')}</div>`;
  }
  function scaleGroup(group, from, to, current, banded) {
    const cls = to - from === 9 ? 'scale ten' : 'scale';
    let h = `<div class="${cls}">`;
    for (let v = from; v <= to; v++) h += `<button type="button" class="${banded ? 'b-' + band(v) : ''}" data-action="pick" data-group="${group}" data-v="${v}" aria-pressed="${current === v}" aria-label="${v} sur 10">${v}</button>`;
    return h + '</div>';
  }
  function runFields() {
    return `
      <fieldset class="field"><legend>Où</legend>${chipGroup('surface', Object.entries(SURF), F.surface)}</fieldset>
      <div class="row2">
        <label class="field"><span>Temps de course (min)</span><input type="text" inputmode="decimal" id="f-dur" value="${esc(inVal(F.dur))}" autocomplete="off"></label>
        <label class="field"><span>Distance (km)</span><input type="text" inputmode="decimal" id="f-dist" value="${esc(inVal(F.dist))}" placeholder="optionnel" autocomplete="off"></label>
      </div>
      <p class="calc" id="f-calc"></p>
      <fieldset class="field"><legend>Foulée</legend>${chipGroup('strike', Object.entries(STRIKES), F.strike)}</fieldset>
      <fieldset class="field"><legend>Douleur max (0 à 10)</legend>${scaleGroup('pain', 0, 10, F.pain, true)}<p class="hint" id="pain-hint"></p></fieldset>
      <div class="sub-head"><p class="eyebrow">Si tu as eu des symptômes</p></div>
      <fieldset class="field"><legend>Côté</legend>${chipGroup('side', Object.entries(SIDES), F.side)}</fieldset>
      <fieldset class="field"><legend>Où ça tirait</legend>${chipGroup('zones', ZONE_CHOICES.map(z => [z, ZONES[z]]), F.zones, true)}</fieldset>
      <div class="row2">
        <label class="field"><span>Apparus après (min)</span><input type="text" inputmode="decimal" id="f-onset" value="${esc(inVal(F.onset))}" placeholder="optionnel" autocomplete="off"></label>
        <label class="field"><span>Disparus après l’arrêt (min)</span><input type="text" inputmode="decimal" id="f-gone" value="${esc(inVal(F.gone))}" placeholder="optionnel" autocomplete="off"></label>
      </div>
      <label class="check"><input type="checkbox" id="f-neuro" ${F.neuro ? 'checked' : ''}><span>Fourmillements, engourdissement ou pied qui tombe</span></label>
      <p class="hint bad" id="neuro-hint" ${F.neuro ? '' : 'hidden'}>Si ça ne passe pas au repos, consulte un médecin rapidement.</p>
      <div class="row2"><label class="field"><span>Dénivelé + (m)</span><input type="text" inputmode="numeric" id="f-elev" value="${esc(inVal(F.elev))}" placeholder="optionnel" autocomplete="off"></label><span></span></div>`;
  }
  function cardioFields() {
    return `
      <fieldset class="field"><legend>Activité</legend>${chipGroup('machine', Object.entries(MACHINES), F.machine)}</fieldset>
      <div class="row2"><label class="field"><span>Durée (min)</span><input type="text" inputmode="decimal" id="f-dur" value="${esc(inVal(F.dur))}" autocomplete="off"></label><span></span></div>
      <fieldset class="field"><legend>Intensité</legend>${chipGroup('intensity', Object.entries(INTENS), F.intensity)}</fieldset>
      <fieldset class="field"><legend>Douleur dans les jambes (0 à 10)</legend>${scaleGroup('pain', 0, 10, F.pain, true)}<p class="hint" id="pain-hint"></p></fieldset>`;
  }
  function renfoFields() {
    const rows = F.items.map((it, i) => {
      let name = it.ex, how = '', reps = '';
      if (it.ex === 'iso') ({ name, how, reps } = ISO);
      else {
        const r = renfoDef(it.ex);
        if (r) { name = r.name; [how, reps] = r.levels[Math.min(Math.max(1, it.level || 1), r.levels.length) - 1]; }
      }
      return `<div class="ritem${it.done ? '' : ' off'}">
        <label class="check"><input type="checkbox" class="ri-done" data-i="${i}" ${it.done ? 'checked' : ''}><span><b>${esc(name)}</b><br><span class="muted small">${esc(how)}${reps ? ` · <span class="nw">${esc(reps)}</span>` : ''}${it.level ? ` · <span class="nw">niv. ${it.level}</span>` : ''}</span></span></label>
        ${it.ex === 'iso' ? '' : `<button type="button" class="chip-btn sm" data-action="ri-easy" data-i="${i}" aria-pressed="${!!it.easy}">Trop facile</button>`}
      </div>`;
    }).join('');
    return `<div class="field"><span>Exercices faits</span><div class="ritems">${rows || '<p class="hint">Aucun exercice prévu.</p>'}</div></div>
      <fieldset class="field"><legend>Douleur max pendant le renfo (0 à 10)</legend>${scaleGroup('pain', 0, 10, F.pain, true)}<p class="hint" id="pain-hint"></p></fieldset>`;
  }
  function exRows() {
    if (!F.exercises.length) return '<p class="hint">Aucun exercice noté. C’est optionnel.</p>';
    return `<div class="ex-labels" aria-hidden="true"><span>Exercice</span><span>Séries × reps</span><span>Charge</span><span></span></div>` +
      F.exercises.map((x, i) => `<div class="ex-row">
        <input type="text" class="ex-in" id="ex-name-${i}" data-i="${i}" data-k="name" value="${esc(x.name)}" placeholder="Exercice" aria-label="Exercice ${i + 1}" autocomplete="off">
        <input type="text" class="ex-in" id="ex-scheme-${i}" data-i="${i}" data-k="scheme" value="${esc(x.scheme)}" placeholder="4 × 8" aria-label="Séries et répétitions" autocomplete="off">
        <input type="text" inputmode="decimal" class="ex-in" id="ex-kg-${i}" data-i="${i}" data-k="kg" value="${esc(x.kg)}" placeholder="${esc(x.lastKg ? x.lastKg + ' kg' : 'kg')}" aria-label="Charge en kg" autocomplete="off">
        <button type="button" class="icon-btn" data-action="del-ex" data-i="${i}" aria-label="Retirer cet exercice">${ICON_X}</button></div>`).join('');
  }
  function gymFields() {
    return `
      <fieldset class="field"><legend>Séance</legend>${chipGroup('session', [['push', 'Push'], ['pull', 'Pull'], ['legs', 'Legs'], ['pdcA', 'Poids du corps A'], ['pdcB', 'Poids du corps B'], ['autre', 'Autre']], F.session)}</fieldset>
      <div class="row2"><label class="field"><span>Durée (min)</span><input type="text" inputmode="decimal" id="f-dur" value="${esc(inVal(F.dur))}" placeholder="optionnel" autocomplete="off"></label><span></span></div>
      <fieldset class="field"><legend>Difficulté ressentie (1 à 10)</legend>${scaleGroup('rpe', 1, 10, F.rpe, false)}</fieldset>
      <div class="field"><span>Exercices</span><div class="ex-list" id="ex-list">${exRows()}</div>
        <div><button type="button" class="btn ghost" data-action="add-ex">+ Ajouter un exercice</button></div></div>`;
  }
  function sheetHTML() {
    const k = F.kind;
    const fields = { run: runFields, renfo: renfoFields, cardio: cardioFields, gym: gymFields }[k]();
    const saveLabel = { run: 'Enregistrer la course', renfo: 'Enregistrer le renfo', cardio: 'Enregistrer la séance', gym: 'Enregistrer la séance' }[k];
    const placeholder = { run: 'Foulée, sensations, ce qui a déclenché les symptômes…', renfo: 'Sensations, exercice difficile…', cardio: 'Machine, sensations…', gym: 'Records, sensations…' }[k];
    const del = !F.id ? '' : F.confirmDelete
      ? `<div class="danger-box"><p><b>Supprimer cette séance pour de bon&nbsp;?</b></p><div class="row-btns"><button type="button" class="btn" data-action="cancel-delete">Annuler</button><button type="button" class="btn danger" data-action="do-delete">Supprimer</button></div></div>`
      : '<div><button type="button" class="btn link-danger" data-action="ask-delete">Supprimer cette séance</button></div>';
    return `<div class="sheet-head"><h2 class="h3" id="sheet-title">${F.id ? 'Modifier la séance' : 'Nouvelle séance'}</h2>
        <button type="button" class="icon-btn" data-action="close-sheet" aria-label="Fermer">${ICON_X}</button></div>
      <div class="sheet-body" id="sheet-body">
        <div class="seg" role="radiogroup" aria-label="Type de séance">${KINDS.map(([v, l]) => `<button type="button" role="radio" data-action="kind" data-v="${v}" aria-checked="${k === v}">${l}</button>`).join('')}</div>
        <label class="field"><span>Date</span><input type="date" id="f-date" value="${esc(F.date)}" max="${todayIso()}"></label>
        ${fields}
        <label class="field"><span>Notes</span><textarea id="f-notes" rows="3" placeholder="${esc(placeholder)}">${esc(F.notes)}</textarea></label>
        ${del}
      </div>
      <div class="sheet-foot"><p class="form-error" id="f-error" hidden></p>
        <button type="button" class="btn ${k === 'run' || k === 'cardio' ? 'primary' : 'gymb'} block" data-action="save" id="f-save">${saveLabel}</button></div>`;
  }
  function renderSheet() {
    const old = $('#sheet-body'); const scroll = old ? old.scrollTop : 0;
    $('#sheet-inner').innerHTML = sheetHTML();
    const nb = $('#sheet-body'); if (nb) nb.scrollTop = scroll;
    updateCalc(); updatePainHint();
  }
  function renderEx() { const el = $('#ex-list'); if (el) el.innerHTML = exRows(); }
  function updateCalc() {
    const el = $('#f-calc'); if (!el || !F) return;
    const v = kmh(F.dur, F.dist), p = pace(F.dur, F.dist);
    el.textContent = v ? `${fmt1(v)} km/h · allure ${p}` : 'Ajoute la distance pour voir ta vitesse et ton allure.';
  }
  function updatePainHint() {
    const el = $('#pain-hint'); if (!el || !F) return;
    const p = F.pain;
    if (F.kind !== 'run') {
      el.className = 'hint' + (p >= 4 ? ' warn' : '');
      el.textContent = p == null ? 'Optionnel.' : p >= 4 ? 'Si ça dure le lendemain, le point jambes allégera ta séance.' : '';
      return;
    }
    el.className = 'hint' + (p >= 4 ? ' warn' : '');
    el.textContent = p == null ? 'Le niveau le plus haut ressenti, même si c’est 0.'
      : p >= 4 ? 'À partir de 4/10, ta prochaine course redescend d’un niveau.'
      : p === 3 ? 'Tu restes au même niveau.'
      : 'Zone verte : cette course compte pour passer au niveau suivant.';
  }
  function openSheet(form) {
    F = form; renderSheet();
    const sh = $('#sheet'), sc = $('#scrim');
    sh.hidden = false; sc.hidden = false; document.body.classList.add('locked');
    requestAnimationFrame(() => { sh.classList.add('open'); sc.classList.add('open'); });
    setTimeout(() => { const b = $('#sheet .sheet-head .icon-btn'); if (b) b.focus({ preventScroll: true }); }, 60);
  }
  function closeSheet() {
    const sh = $('#sheet'), sc = $('#scrim');
    sh.classList.remove('open'); sc.classList.remove('open'); document.body.classList.remove('locked');
    const done = () => { sh.hidden = true; sc.hidden = true; };
    if (reduceMotion) done(); else setTimeout(done, 230);
    F = null;
  }
  function formError(msg) { const el = $('#f-error'); if (el) { el.textContent = msg; el.hidden = !msg; } }

  /* Un exercice noté « trop facile » deux fois de suite au même niveau monte d'un niveau. */
  function renfoLevelUps(entry) {
    const prev = S.entries.filter(e => e.kind === 'renfo' && e.id !== entry.id && byDateAsc(e, entry) < 0).sort(byDateDesc);
    const levels = { ...(S.settings.renfoLevels || {}) };
    const msgs = [];
    entry.items.forEach(it => {
      const r = renfoDef(it.ex);
      if (!r || !it.done || !it.easy || it.level !== renfoLevel(it.ex) || it.level >= r.levels.length) return;
      const last = prev.find(e => (e.items || []).some(x => x.ex === it.ex && x.done));
      const lx = last && last.items.find(x => x.ex === it.ex);
      if (lx && lx.easy && lx.level === it.level) { levels[it.ex] = it.level + 1; msgs.push(`${r.name} : niveau ${it.level + 1}`); }
    });
    if (msgs.length) S.settings = { ...S.settings, renfoLevels: levels };
    return msgs;
  }

  function save() {
    if (!F) return;
    if (!F.date) { formError('Choisis une date.'); return; }
    if (F.date > todayIso()) { formError('La date ne peut pas être dans le futur.'); return; }
    const now = Date.now();
    const base = { kind: F.kind, date: F.date, notes: (F.notes || '').trim(), source: F.source || 'manuel', createdAt: F.createdAt || now, updatedAt: now };
    let doc;
    if (F.kind === 'run') {
      if (!(F.dur > 0)) { formError('Indique ton temps de course en minutes.'); return; }
      if (F.pain == null) { formError('Indique ta douleur max, même si c’est 0.'); return; }
      const sym = F.pain > 0 || F.onset > 0;
      doc = { ...base, plan: F.plan || 'niveau', level: F.level ?? (F.plan === 'niveau' ? levelAt(F.date) : null), surface: F.surface || 'tapis',
        durationMin: F.dur, distanceKm: F.dist > 0 ? F.dist : null, elevGain: F.elev > 0 ? F.elev : null, pain: F.pain,
        zones: sym ? F.zones : [], side: sym ? F.side : null, painOnsetMin: F.onset > 0 ? F.onset : null,
        painGoneMin: typeof F.gone === 'number' && F.gone >= 0 ? F.gone : null, neuro: !!F.neuro, strike: F.strike || null };
      if (F.nextDay) doc.nextDay = F.nextDay;
      if (F.renfoOld) doc.renfo = true;
    } else if (F.kind === 'cardio') {
      if (!F.machine) { formError('Choisis l’activité : vélo, rameur…'); return; }
      if (!(F.dur > 0)) { formError('Indique la durée en minutes.'); return; }
      doc = { ...base, machine: F.machine, durationMin: F.dur, intensity: F.intensity || 'facile', pain: F.pain ?? null };
    } else if (F.kind === 'renfo') {
      const items = F.items.map(x => ({ ex: x.ex, level: x.level ?? null, done: !!x.done, easy: !!x.easy && !!x.done }));
      if (!items.some(x => x.done)) { formError('Coche au moins un exercice.'); return; }
      doc = { ...base, items, pain: F.pain ?? null };
    } else {
      if (!F.session) { formError('Choisis la séance : Push, Pull, Legs…'); return; }
      const exercises = F.exercises.map(x => ({ name: (x.name || '').trim(), scheme: (x.scheme || '').trim(), kg: (x.kg || '').trim() })).filter(x => x.name);
      doc = { ...base, session: F.session, durationMin: F.dur > 0 ? F.dur : null, rpe: F.rpe ?? null, exercises };
    }
    formError('');
    const editing = !!F.id, kind = F.kind;
    const entry = { id: F.id || newId(), ...doc };
    const before = rstate().level;
    let ups = [];
    const ok = commit(() => {
      S.entries = editing ? S.entries.map(e => (e.id === entry.id ? entry : e)) : [...S.entries, entry];
      if (kind === 'renfo' && !editing) ups = renfoLevelUps(entry);
    });
    if (!ok) { formError(STORAGE_ERR); return; }
    closeSheet(); render();
    const after = rstate().level;
    let msg;
    if (ups.length) msg = ups.join(' · ');
    else if (after > before) msg = `Niveau ${after} débloqué : ${RUN_LEVELS[after - 1]} min`;
    else if (after < before) msg = `Retour au niveau ${after} : ${RUN_LEVELS[after - 1]} min`;
    else msg = editing ? 'Modifications enregistrées' : { run: 'Course enregistrée', renfo: 'Renfo enregistré', cardio: 'Séance enregistrée', gym: 'Séance enregistrée' }[kind];
    toast(msg);
  }
  function doDelete() {
    if (!F || !F.id) return;
    const id = F.id;
    if (!commit(() => { S.entries = S.entries.filter(e => e.id !== id); })) { formError(STORAGE_ERR); return; }
    closeSheet(); render(); toast('Séance supprimée');
  }

  /* ---------- Point jambes ---------- */
  function ciPick(b) {
    if (!S.ci) return;
    const k = b.dataset.k;
    const val = k === 'soreness' ? Number(b.dataset.v) : b.dataset.v === 'true';
    S.ci = { ...S.ci, [k]: val };
    $$(`[data-action="ci-pick"][data-k="${k}"]`).forEach(x => {
      const xv = k === 'soreness' ? Number(x.dataset.v) : x.dataset.v === 'true';
      x.setAttribute('aria-pressed', String(xv === val));
    });
    const err = $('#ci-error'); if (err) err.hidden = true;
  }
  function ciSave() {
    const d = S.ci;
    if (!d || d.soreness == null) {
      const err = $('#ci-error'); if (err) { err.textContent = 'Indique ta douleur au repos, même si c’est 0.'; err.hidden = false; }
      return;
    }
    const t = todayIso(); const now = Date.now();
    const prev = checkinOn(S.entries, t);
    const entry = { id: 'ci-' + t, kind: 'checkin', date: t, soreness: d.soreness, walk: d.walk !== false, stairs: d.stairs !== false, neuro: !!d.neuro, createdAt: prev ? prev.createdAt : now, updatedAt: now };
    if (!commit(() => { S.entries = [...S.entries.filter(e => !(e.kind === 'checkin' && e.date === t)), entry]; })) { toast(STORAGE_ERR); return; }
    S.ci = null; S.ciEdit = false;
    render();
    const col = ciColor(entry);
    toast(col === 'green' ? 'Jambes vertes : séance normale' : col === 'orange' ? 'Jambes orange : séance allégée' : 'Jambes rouges : pas de course aujourd’hui');
  }

  /* ---------- Réglages ---------- */
  function toggleTravel() {
    const on = !S.settings.travel;
    if (!commit(() => { S.settings = { ...S.settings, travel: on }; })) { toast(STORAGE_ERR); return; }
    render();
    toast(on ? 'Mode voyage : séances au poids du corps' : 'Mode salle');
  }
  function changeRunLevel(d) {
    const rs = rstate();
    const lv = Math.min(Math.max(1, rs.level + d), rs.max);
    if (lv === rs.level) return;
    if (!commit(() => { S.settings = { ...S.settings, runStart: { level: lv, date: todayIso(), at: Date.now() } }; })) { toast(STORAGE_ERR); return; }
    render();
    toast(`Niveau ${lv} : course de ${RUN_LEVELS[lv - 1]} min`);
  }
  function changeRenfoLevel(ex, d) {
    const r = renfoDef(ex); if (!r) return;
    const lv = Math.min(Math.max(1, renfoLevel(ex) + d), r.levels.length);
    if (!commit(() => { S.settings = { ...S.settings, renfoLevels: { ...(S.settings.renfoLevels || {}), [ex]: lv } }; })) { toast(STORAGE_ERR); return; }
    render();
  }

  /* ---------- Sauvegarde et restauration ---------- */
  async function backup() {
    const data = JSON.stringify({ app: 'cap-trail', version: 2, exportedAt: new Date().toISOString(), entries: S.entries, settings: S.settings }, null, 1);
    const r = await shareFile(`cap-trail-sauvegarde-${todayIso()}.json`, 'application/json', data);
    if (r === 'cancelled') return;
    commit(() => { S.settings = { ...S.settings, lastBackup: todayIso() }; });
    render();
    if (r === 'downloaded') toast('Sauvegarde téléchargée');
  }
  function restoreFrom(text) {
    let parsed;
    try { parsed = JSON.parse(text); } catch (e) { toast('Ce fichier n’est pas une sauvegarde Cap Trail'); return; }
    const list = Array.isArray(parsed) ? parsed : parsed && Array.isArray(parsed.entries) ? parsed.entries : null;
    const valid = (list || []).filter(e => e && e.id && KINDS_OK.includes(e.kind) && /^\d{4}-\d{2}-\d{2}$/.test(e.date || ''));
    if (!valid.length) { toast('Aucune séance trouvée dans ce fichier'); return; }
    const fileSettings = parsed && !Array.isArray(parsed) && parsed.settings && typeof parsed.settings === 'object' && !Array.isArray(parsed.settings) ? parsed.settings : null;
    const wasEmpty = !S.entries.length;
    const map = new Map(S.entries.map(e => [e.id, e]));
    let added = 0;
    valid.forEach(e => { if (!map.has(e.id)) added++; map.set(e.id, e); });
    if (!commit(() => { S.entries = [...map.values()]; if (fileSettings && wasEmpty) S.settings = { ...fileSettings }; })) { toast(STORAGE_ERR); return; }
    render();
    toast(added ? `${added} séance${added > 1 ? 's' : ''} restaurée${added > 1 ? 's' : ''}` : 'Tes séances étaient déjà à jour');
  }

  /* ---------- Export CSV ---------- */
  async function exportCsv() {
    const list = S.entries.slice().sort(byDateAsc);
    if (!list.length) { toast('Rien à exporter pour l’instant'); return; }
    const dec = v => (v == null || v === '' ? '' : String(Math.round(v * 100) / 100).replace('.', ','));
    const head = ['Date', 'Type', 'Séance', 'Lieu ou activité', 'Durée (min)', 'Distance (km)', 'Vitesse (km/h)', 'Allure (min/km)', 'Dénivelé + (m)', 'Douleur max (/10)', 'Côté', 'Zones', 'Symptômes apparus après (min)', 'Disparus après l’arrêt (min)', 'Fourmillements', 'Foulée', 'Intensité ou difficulté', 'Détails', 'Notes'];
    const empty = n => Array(n).fill('');
    const rows = list.map(e => {
      if (e.kind === 'run') {
        const pc = pace(e.durationMin, e.distanceKm);
        return [e.date, 'Course', e.level ? `Niveau ${e.level}` : (RUNPLANS[e.plan] || ''), SURF[e.surface] || '', dec(e.durationMin), dec(e.distanceKm), dec(kmh(e.durationMin, e.distanceKm)),
          pc ? pc.replace(' /km', '') : '', dec(e.elevGain), e.pain ?? '', SIDES[e.side] || '', (e.zones || []).map(z => ZONES[z] || z).join(', '),
          dec(e.painOnsetMin), dec(e.painGoneMin), e.neuro ? 'oui' : 'non', STRIKES[e.strike] || '', '', e.nextDay && NEXT[e.nextDay] ? `Lendemain : ${NEXT[e.nextDay]}` : '', e.notes || ''];
      }
      if (e.kind === 'cardio') return [e.date, 'Cardio sans choc', '', MACHINES[e.machine] || '', dec(e.durationMin), ...empty(4), e.pain ?? '', ...empty(6), INTENS[e.intensity] || '', '', e.notes || ''];
      if (e.kind === 'renfo') {
        const det = (e.items || []).filter(x => x.done).map(x => { const r = renfoDef(x.ex); return x.ex === 'iso' ? ISO.name : `${r ? r.name : x.ex}${x.level ? ` niv. ${x.level}` : ''}${x.easy ? ' (trop facile)' : ''}`; }).join(' / ');
        return [e.date, 'Renfo jambes', '', '', '', ...empty(4), e.pain ?? '', ...empty(7), det, e.notes || ''];
      }
      if (e.kind === 'checkin') {
        const col = ciColor(e);
        return [e.date, 'Point jambes', COLOR_LABEL[col] || '', '', ...empty(5), e.soreness ?? '', '', '', '', '', e.neuro ? 'oui' : 'non', '', '',
          `${e.walk === false ? 'boite' : 'marche normale'} · ${e.stairs === false ? 'escaliers douloureux' : 'escaliers sans douleur'}`, ''];
      }
      return [e.date, 'Salle', (GYM[e.session] || GYM.autre).title, '', dec(e.durationMin), ...empty(11), e.rpe ?? '',
        (e.exercises || []).map(x => `${x.name}${x.scheme ? ' ' + x.scheme : ''}${x.kg ? ' ' + x.kg + ' kg' : ''}`).join(' / '), e.notes || ''];
    });
    const cell = v => { const s = String(v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = String.fromCharCode(0xFEFF) + [head, ...rows].map(r => r.map(cell).join(';')).join('\r\n');
    const r = await shareFile(`cap-trail-journal-${todayIso()}.csv`, 'text/csv', csv);
    if (r === 'downloaded') toast('Fichier téléchargé');
  }

  /* ---------- Petites aides ---------- */
  let toastTimer;
  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2800); }

  const OPTIONAL = ['side', 'strike'];
  function pick(b) {
    const g = b.dataset.group, v = b.dataset.v;
    if (g === 'zones') { const set = new Set(F.zones); if (set.has(v)) set.delete(v); else set.add(v); F.zones = [...set]; }
    else if (g === 'pain' || g === 'rpe') F[g] = Number(v);
    else if (OPTIONAL.includes(g) && F[g] === v) F[g] = null;
    else F[g] = v;
    $$(`[data-group="${g}"]`).forEach(x => {
      const on = g === 'zones' ? F.zones.includes(x.dataset.v) : g === 'pain' || g === 'rpe' ? F[g] === Number(x.dataset.v) : F[g] === x.dataset.v;
      x.setAttribute('aria-pressed', String(on));
    });
    if (g === 'pain') updatePainHint();
    if (g === 'session' && !F.id && !F.exTouched) { F.exercises = defaultExercises(v); renderEx(); }
  }
  function switchKind(k) {
    if (!F || F.kind === k) return;
    F.kind = k;
    if (!F.id) {
      const p = planFor(todayIso());
      if (k === 'renfo' && !F.items.length) F.items = renfoFormItems(p.color);
      if (k === 'gym' && !F.session && p.type === 'gym') { F.session = p.session; F.exercises = defaultExercises(p.session); }
      if (k === 'cardio' && !F.machine) F.machine = S.settings.travel ? 'marche' : 'velo';
    }
    renderSheet();
  }

  /* Info-bulles des graphiques */
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true;
  function showTip(el) {
    const chart = el.closest('.chart'); const svg = el.ownerSVGElement; if (!chart || !svg) return;
    if (tip.parentNode !== chart) chart.appendChild(tip);
    tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
    const cr = chart.getBoundingClientRect(), sr = svg.getBoundingClientRect();
    const k = sr.width / svg.viewBox.baseVal.width;
    let x = sr.left - cr.left + Number(el.dataset.x) * k;
    const y = sr.top - cr.top + Number(el.dataset.y) * k;
    const half = tip.offsetWidth / 2;
    x = Math.max(half, Math.min(cr.width - half, x));
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }

  /* ---------- Évènements ---------- */
  document.addEventListener('click', e => {
    const tipEl = e.target.closest && e.target.closest('[data-tip]');
    if (tipEl) { showTip(tipEl); return; }
    tip.hidden = true;
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
    const b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    const a = b.dataset.action;
    switch (a) {
      case 'new': openSheet(formForNew()); return;
      case 'log-plan': openSheet(formFromPlan()); return;
      case 'log-renfo': openSheet(formForRenfo()); return;
      case 'log-bike': openSheet(formForBike()); return;
      case 'log-first': openSheet(firstRunForm()); return;
      case 'first-later': try { localStorage.setItem('ct-first-later', '1'); } catch (err) { /* rien */ } render(); return;
      case 'edit': { const en = S.entries.find(x => x.id === b.dataset.id); if (en) openSheet(formFromEntry(en)); return; }
      case 'close-sheet': closeSheet(); return;
      case 'filter': S.filter = b.dataset.v; render(); return;
      case 'export': exportCsv(); return;
      case 'install-later': try { localStorage.setItem('ct-install-later', '1'); } catch (err) { /* rien */ } render(); return;
      case 'backup': backup(); return;
      case 'restore': $('#restore-file').click(); return;
      case 'ci-pick': ciPick(b); return;
      case 'ci-save': ciSave(); return;
      case 'ci-edit': S.ciEdit = true; S.ci = null; render(); return;
      case 'ci-cancel': S.ciEdit = false; S.ci = null; render(); return;
      case 'travel': toggleTravel(); return;
      case 'lvl': changeRunLevel(Number(b.dataset.d)); return;
      case 'renfo-lvl': changeRenfoLevel(b.dataset.ex, Number(b.dataset.d)); return;
      case 'share-summary': shareSummary(); return;
      default: break;
    }
    if (!F) return;
    switch (a) {
      case 'kind': switchKind(b.dataset.v); break;
      case 'pick': pick(b); break;
      case 'ri-easy': { const it = F.items[Number(b.dataset.i)]; if (it) { it.easy = !it.easy; b.setAttribute('aria-pressed', String(it.easy)); } break; }
      case 'add-ex': {
        F.exercises.push({ name: '', scheme: '', kg: '' }); F.exTouched = true; renderEx();
        const el = $(`#ex-name-${F.exercises.length - 1}`); if (el) el.focus();
        break;
      }
      case 'del-ex': F.exercises.splice(Number(b.dataset.i), 1); F.exTouched = true; renderEx(); break;
      case 'save': save(); break;
      case 'ask-delete': F.confirmDelete = true; renderSheet(); break;
      case 'cancel-delete': F.confirmDelete = false; renderSheet(); break;
      case 'do-delete': doDelete(); break;
      default: break;
    }
  });
  document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') showTip(el); });
  document.addEventListener('pointerout', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse' && !(e.relatedTarget && el.contains(e.relatedTarget))) tip.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && F) closeSheet(); });

  const sheet = $('#sheet');
  sheet.addEventListener('input', e => {
    if (!F) return;
    const el = e.target;
    if (el.id === 'f-date') F.date = el.value;
    else if (el.id === 'f-dur') { F.dur = num(el.value); updateCalc(); }
    else if (el.id === 'f-dist') { F.dist = num(el.value); updateCalc(); }
    else if (el.id === 'f-elev') F.elev = num(el.value);
    else if (el.id === 'f-onset') F.onset = num(el.value);
    else if (el.id === 'f-gone') F.gone = num(el.value);
    else if (el.id === 'f-notes') F.notes = el.value;
    else if (el.classList.contains('ex-in')) { const x = F.exercises[Number(el.dataset.i)]; if (x) { x[el.dataset.k] = el.value; F.exTouched = true; } }
  });
  sheet.addEventListener('change', e => {
    if (!F) return;
    const el = e.target;
    if (el.id === 'f-neuro') { F.neuro = el.checked; const h = $('#neuro-hint'); if (h) h.hidden = !el.checked; }
    else if (el.classList.contains('ri-done')) {
      const it = F.items[Number(el.dataset.i)];
      if (it) { it.done = el.checked; const row = el.closest('.ritem'); if (row) row.classList.toggle('off', !el.checked); }
    }
  });

  $('#restore-file').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => restoreFrom(String(reader.result || ''));
    reader.onerror = () => toast('Impossible de lire ce fichier');
    reader.readAsText(file);
    e.target.value = '';
  });
  /* Au retour dans l'appli (le lendemain par exemple), la séance du jour se met à jour. */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !F) { S.entries = loadEntries(); S.settings = loadSettings(); render(); }
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  render();
})();
</script>
</body>
</html>
